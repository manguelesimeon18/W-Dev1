<!DOCTYPE html>
<html Lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Inscription Archiva</title>
        <link rel="stylesheet" href="styles/styles.css">

    </head>

    <body class="auth">
        <main class="auth__card">
            <section class="auth__form">
                <h1 class="auth__title">Créer un compte</h1>
                <form id="register-form">
                    <div class="field">
                        <label for="fullname" class="field__label">Nom Complet</label>
                          <div class="field__control">
                             <input type="text" id="fullname" class="field__input" placeholder="Entrez votre nom complet" required>
                          </div>
                    </div>
                    <div class="field">
                         <label for="email" class="field__label">Email</label>
                       <div class="field__control">
                         <input type="email" id="email" class="field__input" placeholder="Entrez votre email" required>
                        </div>
                    </div>

                    <div class="field">
                        <label for="level" class="field__label">Niveaux</label>
                        <div class="field__control">
                            <select id="level" class="field__input">
                                <option>X1</option>
                                <option>X2</option>
                                <option>X3</option>
                                <option>X4</option>
                                <option>X5</option>
                            </select>
                        </div>
                    </div>

                <div class="field">
                    <label for="password" class="field__label">Mot de passe</label>
                    <div class="field__control">
                        <input type="password" id="password" class="field__input" placeholder="Entrez votre mot de passe"  required>
                        <span class="field__icon">
                            <svg width="20" height="20" viezbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                                <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12"></path>
                                <circle cx="12" cy="12" r="2.8" fill="currentColor"  stroke="none"></circle>
                            </svg>
                        </span>
                    </div>
                </div>

                
                <button type="submit" class="btn btn--primary btn--block auth__submit">Créer compte</button>
                <p class="auth__switch">
                    Vous avez un compte?
                    <a href="connexion.html" class="auth__link">Connectez vous</a>
                </p>

                </form>

            </section>
            <aside class="auth__illustration">
                <img src="assets/images/signup-illustration.png" alt="">
            </aside>
        </main>

        <script src="script/script.js" defer></script>
    </body>

    
</html>
